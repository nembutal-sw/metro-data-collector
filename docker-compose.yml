services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metro
      POSTGRES_USER: metro
      POSTGRES_PASSWORD: metro
      TZ: Asia/Seoul
    volumes:
      - metro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metro"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    volumes:
      - /docker/metro/.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    expose:
      - "8000"
    volumes:
      - /docker/metro/.env:/app/.env:ro
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["metro-sync", "worker"]
    volumes:
      - /docker/metro/.env:/app/.env:ro
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  metro-postgres:
