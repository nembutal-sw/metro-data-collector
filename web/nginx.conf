server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /odsay/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /docs {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /redoc {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location = /tracetrain {
        alias /usr/share/nginx/html/tracetrain.html;
        default_type text/html;
    }

    location = /tracetrain.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
